version: '3.8'

services:
  # Node.js API Server + ASCILI Web Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ascii-streamer-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    restart: unless-stopped

